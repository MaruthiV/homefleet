name: Package and replay checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev]' numba==0.62.1
      - run: python -m pytest -q
      - run: python -m homefleet.demo --check
