[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homefleet"
version = "0.0.1"
description = "homefleet-ercot: adaptive reliability reserves for residential battery fleets"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=15",
  "pyyaml",
  "scipy",
  "scikit-learn",
  "requests",
  "tqdm",
]

[project.optional-dependencies]
full = [
  "cvxpy",
  "osqp",
  "highspy",
  "lightgbm",
  "gymnasium>=1.0",
  "torch",
  "matplotlib",
  "s3fs",
  "opendssdirect.py",
]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
